# Local build speed-ups only — see README.md § Hacking / development.
#
# Linux (gnu): link through scripts/fast-link.sh, which uses mold when mold
# and clang are installed (CI's test job links with mold too) and is plain
# `cc` otherwise. RUPU_NO_FAST_LINKER=1 opts out. The musl targets CI and
# release builds use are untouched.
#
# macOS: deliberately nothing. Apple's default ld-prime was measured against
# rust-lld; see the README for the numbers.

[target.x86_64-unknown-linux-gnu]
linker = "scripts/fast-link.sh"

[target.aarch64-unknown-linux-gnu]
linker = "scripts/fast-link.sh"
