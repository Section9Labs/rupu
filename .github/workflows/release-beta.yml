name: release-beta

# Cuts a beta when `main` has something worth shipping. Three jobs:
#
#   decide  — is there anything to release (and what is the next tag)?
#   ci      — the FULL ci.yml suite, run here against the exact commit that
#             will be tagged. This is CI's only run on `main`: pull requests
#             no longer run it and there is no push trigger, so a batch of
#             PRs is tested once, at release (see ci.yml's header and
#             docs/superpowers/specs/2026-10-01-rupu-release-gated-ci-design.md).
#   tag     — push the annotated tag, only if every ci job passed.
#
# Publishing itself is release.yml's job, triggered by that tag.
on:
  schedule:
    # 07:37 UTC. Off the :00 mark (every scheduled workflow on GitHub piles
    # onto it).
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if nothing shipped has changed since the last beta"
        type: boolean
        default: false
      dry_run:
        description: "Decide and run the full CI suite, but push no tag (the only mode allowed off main)"
        type: boolean
        default: false

concurrency:
  # Two beta cuts racing would compute the same counter and one would fail to
  # push. Queue instead of cancelling. Per ref, so a dry run on a branch
  # never queues behind (or ahead of) a real cut on main.
  group: release-beta-${{ github.ref }}
  cancel-in-progress: false

# The tag is pushed with the MAIN_PUSH_KEY deploy key, never the token, so
# nothing here needs write access.
permissions:
  contents: read

jobs:
  decide:
    name: decide whether to cut a beta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.decide.outputs.go }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      # Everything below works on `github.sha`, and the called ci.yml checks
      # out that same commit, so what is tested is what is tagged even if
      # main moves during the ~15 minute CI run. Dispatched from a branch,
      # that commit is the branch's — only a dry run may do that.
      - name: Only main is released
        if: github.ref != 'refs/heads/main' && inputs.dry_run != true
        run: |
          echo "::error::release-beta cuts tags from main only (got ${{ github.ref }}). Use -f dry_run=true to exercise it on a branch."
          exit 1

      - uses: actions/checkout@v5
        with:
          # Full history + tags: the counter is derived from the tag list,
          # and the shipped-changes check diffs against the last beta.
          fetch-depth: 0

      - name: Decide whether to cut a beta
        id: decide
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # A skip is a normal outcome (exit 0), but it must be visible on
          # the run page rather than buried in a log line.
          skip() {
            echo "::notice::$1"
            echo "No beta cut: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          base=$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml \
            | head -n1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+[^"]*)".*/\1/')
          echo "base version: $base"

          # -- Condition 2: the stall-guard. ------------------------------
          # After stable v0.71.0 ships, a v0.71.0-beta.N sorts BELOW it under
          # semver and would walk `rupu update` backwards on the beta channel.
          # Deliberately NOT bypassable by `force`.
          #
          # The comparison is `sort -V`, not `=`: equality alone would let a
          # base that had somehow ended up BELOW the newest stable (a bad
          # manual edit, a reverted bump commit) sail through the guard and
          # cut a backward-sorting beta. Anything not strictly greater than
          # the shipped stable is a stall, not just an exact match.
          #
          # release-stable.yml's `needs_bump` path is what clears this state:
          # it re-runs the version bump whenever main's base is not above the
          # newest stable, whether or not a promotion happened that week.
          # Without that counterpart this skip is a permanent, silent deadlock.
          # Strict `^v<major>.<minor>.<patch>$`, byte-identical to the filter
          # release-stable.yml uses. The two MUST agree on what "the newest
          # stable" is: if this one skipped against a legacy tag like
          # `v0.45.0-cli` that the promoter's filter excluded, the promoter
          # would see no reason to bump and the beta channel would deadlock.
          latest_stable=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$latest_stable" ]; then
            highest=$(printf '%s\nv%s\n' "$latest_stable" "$base" | sort -V | tail -n1)
            if [ "$highest" = "$latest_stable" ]; then
              skip "base $base is not newer than the shipped stable $latest_stable — waiting for the version bump"
            fi
          fi

          # -- Condition 1: something shipped must have changed. ---------
          # Bypassable with `force`: re-releasing is a legitimate manual act
          # (a botched upload, a signing fix).
          #
          # `prev` is the nearest beta tag in this commit's history,
          # whatever its base — after a stable promotion bumps the base, the
          # bump commit itself is the change. Then: if the only paths that
          # changed since `prev` are documentation (scripts/shipped-paths.sh),
          # a release would rebuild an identical binary, so skip it rather
          # than spend a full CI run on it.
          #
          # (Green CI used to be condition 3, checked by querying ci.yml runs
          # for this SHA. It is now the `ci` job below.)
          head_sha=$(git rev-parse HEAD)
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*-beta*' HEAD 2>/dev/null || true)
          if [ -n "$prev" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "::notice::force: releasing whatever changed since $prev"
            elif [ "$(git rev-parse "$prev^{commit}")" = "$head_sha" ]; then
              skip "main is unchanged since $prev"
            else
              shipped=$(git diff --name-only "$prev" HEAD | scripts/shipped-paths.sh)
              if [ -z "$shipped" ]; then
                skip "only documentation changed since $prev"
              fi
              # A here-string, not `printf | head`: under pipefail, head
              # closing the pipe early SIGPIPEs printf and aborts the step
              # on any batch of more than 50 paths.
              echo "$(wc -l <<< "$shipped" | tr -d ' ') shipped path(s) changed since $prev:"
              head -n 50 <<< "$shipped"
            fi
          fi

          tag=$(git tag -l | scripts/next-beta-version.sh "$base")
          echo "next tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "go=true"  >> "$GITHUB_OUTPUT"

  ci:
    name: full CI
    needs: decide
    if: needs.decide.outputs.go == 'true'
    # A called workflow may only narrow the caller's token, so everything
    # ci.yml's jobs declare must be granted here. `pull-requests: read` is
    # for its `scope` job, which only uses it on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  tag:
    name: push the tag
    # `needs: ci` with the implicit success() — a failed, cancelled or
    # skipped ci job means no tag.
    needs: [decide, ci]
    if: needs.decide.outputs.go == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Push the tag
        env:
          MAIN_PUSH_KEY: ${{ secrets.MAIN_PUSH_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          # THE TAG MUST BE PUSHED OVER SSH WITH A DEPLOY KEY. Do not
          # "simplify" this back to the ambient token.
          #
          # GitHub: "Events triggered by the GITHUB_TOKEN will not create a
          # new workflow run, with the following exceptions: workflow_dispatch
          # and repository_dispatch." release.yml triggers on `push: tags`, so
          # a tag pushed with the token that actions/checkout@v5 baked into
          # `http.extraheader` appears in the repo and publishes NOTHING —
          # and this job still goes green. Silent, permanent, every morning.
          #
          # MAIN_PUSH_KEY is the repo's deploy key (the same credential
          # release.yml's `community` job pushes main with). Pushes from a
          # deploy key are not "triggered by GITHUB_TOKEN", so release.yml
          # runs.
          if [ -z "${MAIN_PUSH_KEY:-}" ]; then
            echo "::error::MAIN_PUSH_KEY is not set — the tag would push over the ambient token, which does not trigger release.yml, so nothing would be published."
            exit 1
          fi
          mkdir -p -m 700 "$HOME/.ssh"
          printf '%s\n' "$MAIN_PUSH_KEY" > "$HOME/.ssh/main_push"
          chmod 600 "$HOME/.ssh/main_push"
          ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts_main" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/main_push -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_main"
          # checkout@v5 wired `origin` to an HTTPS URL with the ambient token
          # baked into an extraheader; that identity is the one that does not
          # trigger workflows, so the header must go and the remote must be
          # re-pointed at SSH.
          git config --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "git@github.com:${REPO}.git"

          # ANNOTATED, not lightweight. release-stable.yml's soak window reads
          # `%(creatordate:unix)`, which for a lightweight tag is the COMMIT
          # date — so a commit that sat red on main for two days would count
          # as fully soaked the minute its beta was cut. An annotated tag
          # carries its own creation time, which is what "has been installable
          # as a beta for N days" actually means. Annotating needs a committer
          # identity, hence the git config below.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On `github.sha` explicitly: the commit decide examined and ci
          # tested, not whatever main's HEAD has become since.
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "::notice::pushed $TAG — release.yml takes it from here"
          echo "Pushed **$TAG** on \`$GITHUB_SHA\` — release.yml publishes it." >> "$GITHUB_STEP_SUMMARY"

      # Same reasoning as release.yml's paired cleanup: harmless on a hosted
      # runner whose VM is destroyed, a leak on a self-hosted one.
      - name: Remove the main push key
        if: always()
        run: rm -f "$HOME/.ssh/main_push"
