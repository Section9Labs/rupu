name: release

# One tag push publishes every platform. Channel is derived from the tag
# suffix, preserving the two-tag scheme `scripts/gh-build.sh` established:
# a rolling tag (latest-beta / latest-stable) plus a versioned tag.
# `rupu update` resolves releases by semver + the `prerelease` flag, so that
# flag is the part that actually has to be right.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.70.3-beta"
        required: true

concurrency:
  group: release-${{ github.ref }}
  # Deliberately NOT cancel-in-progress: cancelling mid-upload is how a
  # half-published release happens.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  meta:
    name: derive channel from tag
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.d.outputs.channel }}
      version: ${{ steps.d.outputs.version }}
      rolling_tag: ${{ steps.d.outputs.rolling_tag }}
      prerelease: ${{ steps.d.outputs.prerelease }}
      tag: ${{ steps.d.outputs.tag }}
    steps:
      - id: d
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # Require a semver shape: `vfoo` would otherwise be accepted as a
          # stable release with version "foo", and that string gets stamped
          # into the binary via RUPU_RELEASE_VERSION.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*-beta|v[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*)
              echo "channel=beta"            >> "$GITHUB_OUTPUT"
              echo "rolling_tag=latest-beta" >> "$GITHUB_OUTPUT"
              echo "prerelease=true"         >> "$GITHUB_OUTPUT" ;;
            # By this point the two well-formed beta shapes have already matched,
            # so anything still carrying a character that is not a digit or a dot
            # after the leading `v` is malformed — a typo'd prerelease (`-beta.x`,
            # `-rc1`) or a junk suffix (`0.71.0extra`). Without this they fall
            # through to the stable arm and publish as a real release.
            v*[!0-9.]*)
              echo "::error::tag '$tag' has a malformed version or an unrecognized prerelease suffix"; exit 1 ;;
            v[0-9]*.[0-9]*.[0-9]*)
              echo "channel=stable"            >> "$GITHUB_OUTPUT"
              echo "rolling_tag=latest-stable" >> "$GITHUB_OUTPUT"
              echo "prerelease=false"          >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::tag '$tag' is not v<X.Y.Z>[-beta]"; exit 1 ;;
          esac
          echo "tag=$tag"          >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"  >> "$GITHUB_OUTPUT"

  web:
    name: build embedded CP UI
    # `needs: meta` purely so the checkout below can pin `meta.outputs.tag`;
    # nothing else here reads a meta output.
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Pin the tag explicitly. On a tag push `github.ref_name` is
          # already the tag, but a `workflow_dispatch` re-publish runs
          # from the default branch — a bare checkout would then build
          # `main` while `publish` uploads with `--clobber`, silently
          # replacing the tag's assets with binaries from a different
          # tree. The AUR PKGBUILD, Homebrew formula and flake.nix all
          # pin those checksums, so every community install path would
          # start failing hash verification.
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `package-lock.json` is generated by npm 11 locally. npm 10 reads that
      # lock as incomplete and `npm ci` fails with "Missing: @esbuild/...
      # from lock file" — vitest 4 pulls a nested vite 8 whose esbuild 0.28
      # platform binaries npm 11 omits and npm 10 demands. Matching the major
      # is the fix; regenerating the lock under npm 11 is a no-op, and doing
      # it from scratch drags in alpha dependencies.
      - name: Match the npm major that generates the lockfile
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version
          major=$(npm --version | cut -d. -f1)
          if [ "$major" -lt 11 ]; then
            echo "::error::npm $major is too old to read an npm-11 lockfile"
            exit 1
          fi

      # Built ONCE and shared, so all three binaries embed a byte-identical
      # UI. Skipping this is what makes rupu-cp fall back to its "not built"
      # placeholder — the CI gate does exactly that, deliberately.
      - run: make cp-web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/rupu-cp/web/dist
          if-no-files-found: error
          retention-days: 1

  linux:
    name: build ${{ matrix.platform }}
    needs: [meta, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Pin the tag explicitly. On a tag push `github.ref_name` is
          # already the tag, but a `workflow_dispatch` re-publish runs
          # from the default branch — a bare checkout would then build
          # `main` while `publish` uploads with `--clobber`, silently
          # replacing the tag's assets with binaries from a different
          # tree. The AUR PKGBUILD, Homebrew formula and flake.nix all
          # pin those checksums, so every community install path would
          # start failing hash verification.
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: crates/rupu-cp/web/dist

      - name: Build the pinned musl image
        run: docker build -f docker/linux-build.Dockerfile -t rupu-linux-build .

      - name: Build (channel-stamped)
        run: |
          docker run --rm \
            -e RUPU_RELEASE_CHANNEL="${{ needs.meta.outputs.channel }}" \
            -e RUPU_RELEASE_VERSION="${{ needs.meta.outputs.version }}" \
            -v "$PWD":/work -w /work rupu-linux-build \
            cargo build --release -p rupu-cli --target-dir target/linux-musl

      - name: Build again with the package install marker
        run: |
          docker run --rm \
            -e RUPU_RELEASE_CHANNEL="${{ needs.meta.outputs.channel }}" \
            -e RUPU_RELEASE_VERSION="${{ needs.meta.outputs.version }}" \
            -e RUPU_INSTALL_METHOD=pkg \
            -v "$PWD":/work -w /work rupu-linux-build \
            cargo build --release -p rupu-cli --target-dir target/linux-musl-pkg
          # Staged OUTSIDE dist/ deliberately: dist/ becomes the asset-*
          # artifact that publish uploads verbatim to the release, and this
          # binary is a packaging input, not something a user should ever
          # download directly (it refuses to self-update by design).
          mkdir -p pkgbin
          cp target/linux-musl-pkg/release/rupu "pkgbin/rupu-${{ matrix.platform }}-pkg"

      - name: Stage the asset under its canonical name
        run: |
          set -euo pipefail
          bin=target/linux-musl/release/rupu
          # The binary names itself. Deriving this any other way is the
          # defect #555 fixed (`uname -m` says x86_64 where rupu says x64).
          platform=$(docker run --rm -v "$PWD":/work -w /work rupu-linux-build \
            "$bin" update --print-platform)
          # Cross-check against the matrix label so a runner/arch mix-up
          # cannot publish a mislabelled asset.
          if [ "$platform" != "${{ matrix.platform }}" ]; then
            echo "::error::binary reports '$platform', matrix says '${{ matrix.platform }}'"
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/rupu-$platform"
          ( cd dist && sha256sum "rupu-$platform" > "rupu-$platform.sha256" )
          cat "dist/rupu-$platform.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

      # A deliberately non-`asset-*`-named artifact: `publish` collects
      # everything matching `asset-*` and uploads it straight to the
      # release, and this binary must never reach a user directly.
      - uses: actions/upload-artifact@v4
        with:
          name: pkgbin-${{ matrix.platform }}
          path: pkgbin/
          if-no-files-found: error

  packages:
    name: build .deb and .rpm
    needs: [meta, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Pin the tag explicitly. On a tag push `github.ref_name` is
          # already the tag, but a `workflow_dispatch` re-publish runs
          # from the default branch — a bare checkout would then build
          # `main` while `publish` uploads with `--clobber`, silently
          # replacing the tag's assets with binaries from a different
          # tree. The AUR PKGBUILD, Homebrew formula and flake.nix all
          # pin those checksums, so every community install path would
          # start failing hash verification.
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install nfpm
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/nfpm.deb \
            https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
          nfpm --version

      # Pulled from pkgbin-* (the pkg-marked build), NOT asset-* (the
      # tarball build) — asset-* is what `publish` uploads verbatim to the
      # release, and these binaries are packaging inputs only.
      - uses: actions/download-artifact@v4
        with:
          name: pkgbin-linux-x64
          path: staging/x64
      - uses: actions/download-artifact@v4
        with:
          name: pkgbin-linux-arm64
          path: staging/arm64

      # Completions and the man page are architecture-independent, and this
      # runner cannot execute the arm64 binary — so generate once from x64
      # and reuse for both packages.
      - name: Generate completions and man page (once, from the x64 binary)
        run: |
          set -euo pipefail
          chmod +x staging/x64/rupu-linux-x64-pkg
          bin=./staging/x64/rupu-linux-x64-pkg
          mkdir -p shared/completions
          "$bin" completions print bash --static > shared/completions/rupu.bash
          "$bin" completions print zsh  --static > shared/completions/_rupu
          "$bin" completions print fish --static > shared/completions/rupu.fish
          "$bin" man > shared/rupu.1
          gzip -9 -n -f shared/rupu.1
          ls -la shared shared/completions

      - name: Build all four packages
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # nfpm rejects a leading `v` and pre-release shapes vary; strip any
          # leading v and keep the rest.
          ver="${VERSION#v}"
          mkdir -p out
          # binname points at the -pkg build (RUPU_INSTALL_METHOD=pkg), not
          # the tarball binary staged alongside it — see the "Build again
          # with the package install marker" step in the linux job.
          for pair in "x64:amd64:rupu-linux-x64-pkg" "arm64:arm64:rupu-linux-arm64-pkg"; do
            src="${pair%%:*}"; rest="${pair#*:}"
            arch="${rest%%:*}"; binname="${rest#*:}"
            rm -rf dist && mkdir -p dist/completions
            cp "staging/$src/$binname" dist/rupu
            chmod +x dist/rupu
            cp shared/completions/* dist/completions/
            cp shared/rupu.1.gz dist/rupu.1.gz
            ./packaging/build-packages.sh "$ver" "$arch"
            mv dist/*.deb dist/*.rpm out/
          done
          ls -la out

      # The architecture strings differ by format — .deb uses amd64/arm64,
      # .rpm uses x86_64/aarch64. A mismatch ships a package that installs on
      # the wrong machine, so assert rather than assume.
      - name: Assert the emitted filenames
        run: |
          set -euo pipefail
          ls out
          test -n "$(ls out/*amd64.deb 2>/dev/null)"   || { echo "::error::no amd64 .deb"; exit 1; }
          test -n "$(ls out/*arm64.deb 2>/dev/null)"   || { echo "::error::no arm64 .deb"; exit 1; }
          test -n "$(ls out/*x86_64.rpm 2>/dev/null)"  || { echo "::error::no x86_64 .rpm"; exit 1; }
          test -n "$(ls out/*aarch64.rpm 2>/dev/null)" || { echo "::error::no aarch64 .rpm"; exit 1; }
          test "$(ls out | wc -l)" -eq 4 || { echo "::error::expected exactly 4 packages"; exit 1; }

      - name: Verify the .deb installs and runs on Debian
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/out":/pkg debian:12 bash -c '
            set -euo pipefail
            apt-get update -qq
            # `apt-get install ./file.deb` resolves declared dependencies,
            # which is the whole point of shipping a package rather than a
            # tarball — this proves ripgrep gets pulled in.
            apt-get install -y -qq /pkg/*amd64.deb
            command -v rg    >/dev/null || { echo "ripgrep dependency was not installed"; exit 1; }
            rupu --version
            test -f /usr/share/bash-completion/completions/rupu || { echo "bash completions missing"; exit 1; }
            test -f /usr/share/man/man1/rupu.1.gz              || { echo "man page missing"; exit 1; }
            # The packaged binary must refuse to update itself. Capture
            # first, then grep the variable: `rupu update` exits nonzero on
            # a packaged install (by design), and under `set -o pipefail`
            # `if cmd | grep -q ...` takes its exit status from `cmd`, not
            # from whether grep matched — so a pipeline would always fail
            # here even when the refusal text is present.
            out=$(rupu update 2>&1) || true
            if echo "$out" | grep -q "apt upgrade rupu"; then
              echo "packaged install correctly refuses self-update"
            else
              echo "::error::packaged install did not refuse rupu update"; exit 1
            fi
            # --check must remain permitted: a user must be able to learn
            # they are behind regardless of how they installed. Tolerate a
            # nonzero exit (exit 10 means update available, and the network
            # may be unavailable in CI) but assert it was NOT refused.
            out=$(rupu update --check 2>&1) || true
            if echo "$out" | grep -q "upgrade rupu"; then
              echo "::error::--check must not be refused on a packaged install"; exit 1
            fi
            echo "--check correctly permitted"
          '

      - name: Verify the .rpm installs and runs on Fedora
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/out":/pkg fedora:41 bash -c '
            set -euo pipefail
            dnf install -y -q /pkg/*x86_64.rpm
            command -v rg >/dev/null || { echo "ripgrep dependency was not installed"; exit 1; }
            rupu --version
            test -f /usr/share/man/man1/rupu.1.gz || { echo "man page missing"; exit 1; }
            # Fedora is RHEL-family, so the hint must say dnf — this is the
            # check that proves runtime distro detection works and that an
            # rpm user is not told to run apt. Capture first, then grep the
            # variable (see the Debian step above for why: under pipefail,
            # `cmd | grep -q ...` takes the nonzero exit of cmd even when
            # grep matches, so the `if` would always take the else branch).
            out=$(rupu update 2>&1) || true
            if echo "$out" | grep -q "dnf upgrade rupu"; then
              echo "packaged install correctly refuses self-update, naming dnf"
            else
              echo "::error::rpm install did not refuse with a dnf hint"; exit 1
            fi
            # --check must remain permitted on the rpm path too: the
            # invariant is stated for packaged installs generally, not
            # Debian-only. Tolerate a nonzero exit (exit 10 means update
            # available, and the network may be unavailable in CI) but
            # assert it was NOT refused.
            out=$(rupu update --check 2>&1) || true
            if echo "$out" | grep -q "upgrade rupu"; then
              echo "::error::--check must not be refused on a packaged install"; exit 1
            fi
            echo "--check correctly permitted"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: asset-packages
          path: out/
          if-no-files-found: error

  macos:
    name: build darwin-arm64
    needs: [meta, web]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Pin the tag explicitly. On a tag push `github.ref_name` is
          # already the tag, but a `workflow_dispatch` re-publish runs
          # from the default branch — a bare checkout would then build
          # `main` while `publish` uploads with `--clobber`, silently
          # replacing the tag's assets with binaries from a different
          # tree. The AUR PKGBUILD, Homebrew formula and flake.nix all
          # pin those checksums, so every community install path would
          # start failing hash verification.
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: crates/rupu-cp/web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      # Import the Developer ID cert into a throwaway keychain rather than
      # the runner's login keychain. Discarded with the runner.
      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f /tmp/cert.p12
          # Without this, codesign blocks on a GUI prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning

      - name: Build (channel-stamped)
        env:
          RUPU_RELEASE_CHANNEL: ${{ needs.meta.outputs.channel }}
          RUPU_RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: cargo build --release -p rupu-cli

      # rupu-update's verify.rs runs `codesign --verify --strict` before
      # swapping a binary in, so an unsigned macOS asset would break
      # self-update for every existing user.
      - name: Sign
        run: scripts/sign-dev.sh release

      - name: Notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          key="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
          # notarytool takes an archive, not a bare binary.
          ditto -c -k --keepParent target/release/rupu "$RUNNER_TEMP/rupu.zip"
          xcrun notarytool submit "$RUNNER_TEMP/rupu.zip" \
            --key "$key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          rm -rf "$RUNNER_TEMP/private_keys"
          # Bare binaries cannot be stapled (stapler handles .app/.pkg/.dmg
          # only); the ticket is served online. See scripts/notarize-release.sh.

      - name: Stage the asset under its canonical name
        run: |
          set -euo pipefail
          platform=$(./target/release/rupu update --print-platform)
          if [ "$platform" != "darwin-arm64" ]; then
            echo "::error::binary reports '$platform', expected darwin-arm64"
            exit 1
          fi
          mkdir -p dist
          cp target/release/rupu "dist/rupu-$platform"
          ( cd dist && shasum -a 256 "rupu-$platform" > "rupu-$platform.sha256" )
          cat "dist/rupu-$platform.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-darwin-arm64
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    needs: [meta, linux, macos, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Pin the tag explicitly. On a tag push `github.ref_name` is
          # already the tag, but a `workflow_dispatch` re-publish runs
          # from the default branch — a bare checkout would then build
          # `main` while `publish` uploads with `--clobber`, silently
          # replacing the tag's assets with binaries from a different
          # tree. The AUR PKGBUILD, Homebrew formula and flake.nix all
          # pin those checksums, so every community install path would
          # start failing hash verification.
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      # Publishing from one job, after every build has succeeded, is what
      # makes the release atomic: a failed Linux build means no release at
      # all, rather than a macOS-only release that looks complete.
      - name: Sanity-check the asset set
        run: |
          set -euo pipefail
          ls -la dist
          for p in darwin-arm64 linux-x64 linux-arm64; do
            test -f "dist/rupu-$p"        || { echo "::error::missing rupu-$p"; exit 1; }
            test -f "dist/rupu-$p.sha256" || { echo "::error::missing rupu-$p.sha256"; exit 1; }
          done
          test "$(ls dist/*.deb dist/*.rpm 2>/dev/null | wc -l)" -eq 4 \
            || { echo "::error::expected 4 packages"; exit 1; }
          ( cd dist && sha256sum -c ./*.sha256 )

      - name: Publish rolling and versioned releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          VERSION: ${{ needs.meta.outputs.version }}
          ROLLING: ${{ needs.meta.outputs.rolling_tag }}
          VERSIONED: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          ${CHANNEL} release of rupu \`${VERSION}\`.

          | Asset | Platform |
          |---|---|
          | \`rupu-darwin-arm64\` | macOS, Apple Silicon — signed + notarized |
          | \`rupu-linux-x64\` | Linux x86_64 — static musl |
          | \`rupu-linux-arm64\` | Linux aarch64 — static musl |
          | \`rupu_${VERSION}_amd64.deb\` / \`rupu_${VERSION}_arm64.deb\` | Debian/Ubuntu package (declares its own deps, installs completions + man page) |
          | \`rupu-${VERSION}.x86_64.rpm\` / \`rupu-${VERSION}.aarch64.rpm\` | Fedora/RHEL package (declares its own deps, installs completions + man page) |

          The Linux binaries are statically linked, so they run on any
          distribution — Debian, RHEL, Alpine, distroless — regardless of its
          glibc version.

          Prefer the \`.deb\`/\`.rpm\` on a Debian/Ubuntu or Fedora/RHEL
          system — they pull in dependencies automatically:

          \`\`\`sh
          sudo apt install ./rupu_${VERSION}_amd64.deb
          sudo dnf install ./rupu-${VERSION}.x86_64.rpm
          \`\`\`

          Prefer \`apt upgrade\`/\`dnf upgrade\` over downloading a \`.deb\`/\`.rpm\`
          by hand for every release? Set up the hosted repository once — see
          "Linux packages" in the
          [README](https://github.com/${{ github.repository }}#install) for
          the \`apt\`/\`dnf\` setup snippets (stable and beta).

          **Windows:** install the Linux binary under WSL2.

          Built from \`${GITHUB_SHA}\`.
          EOF
          )

          # The rolling tag floats by definition; move it to this commit.
          git tag -f "$ROLLING" "$GITHUB_SHA"
          git push --force origin "refs/tags/$ROLLING"

          for tag in "$ROLLING" "$VERSIONED"; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes "$notes" --prerelease="$PRERELEASE"
            else
              gh release create "$tag" --title "rupu $tag" \
                --notes "$notes" --prerelease="$PRERELEASE"
            fi

            # The four packages are version-named
            # (rupu_0.70.4~beta_amd64.deb), unlike every other asset here
            # (rupu-linux-x64), so `--clobber` never overwrites them — every
            # release would otherwise pile four more files onto the rolling
            # tag forever. On the rolling tag only, delete whatever .deb/.rpm
            # assets are already there first, so it always carries exactly
            # the current release's packages. The versioned tag is a
            # permanent record and keeps every package it ever published.
            if [ "$tag" = "$ROLLING" ]; then
              existing=$(gh release view "$tag" --json assets \
                --jq '.assets[].name | select(endswith(".deb") or endswith(".rpm"))')
              for name in $existing; do
                gh release delete-asset "$tag" "$name" --yes || true
              done
            fi

            gh release upload "$tag" dist/* --clobber
          done

          echo "published: $ROLLING and $VERSIONED"

  repo:
    name: publish apt/yum repositories
    needs: [meta, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Separate from the per-tag `release-${{ github.ref }}` group above: a
    # beta release and a stable release run in different tag groups and can
    # race each other here. Both clone gh-pages and push; without this, the
    # second push is rejected non-fast-forward and that release's channel is
    # left at the previous version. This group has nothing to do with the
    # tag, so it serializes every gh-pages publish across both channels.
    # NOT cancel-in-progress: cancelling mid-publish is how a half-published
    # repo happens (same reasoning as the top-level concurrency group).
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # Pin the tag explicitly. On a tag push `github.ref_name` is
          # already the tag, but a `workflow_dispatch` re-publish runs
          # from the default branch — a bare checkout would then build
          # `main` while `publish` uploads with `--clobber`, silently
          # replacing the tag's assets with binaries from a different
          # tree. The AUR PKGBUILD, Homebrew formula and flake.nix all
          # pin those checksums, so every community install path would
          # start failing hash verification.
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install repository tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c rpm

      - uses: actions/download-artifact@v4
        with:
          name: asset-packages
          path: pkgs

      # The key lives in RUNNER_TEMP, never under the checkout or the
      # Pages publish root — a signing key committed to a public repo is
      # unrecoverable.
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Build the signed repositories
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp docs/pages/rupu-archive-keyring.asc site/
          ./packaging/build-apt-repo.sh pkgs "$CHANNEL" site
          ./packaging/build-yum-repo.sh pkgs "$CHANNEL" site

      # Verify BEFORE publishing. A broken signature fails on the user's
      # machine at install time with an error they cannot diagnose.
      - name: Verify the signatures
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          gpg --verify "site/apt/dists/$CHANNEL/Release.gpg" \
                       "site/apt/dists/$CHANNEL/Release"
          gpg --verify "site/apt/dists/$CHANNEL/InRelease"
          gpg --verify "site/yum/$CHANNEL/repodata/repomd.xml.asc" \
                       "site/yum/$CHANNEL/repodata/repomd.xml"
          echo "signatures verified"

      - name: Confirm no private key material is about to be published
        run: |
          set -euo pipefail
          if grep -rl "PRIVATE KEY BLOCK" site/ 2>/dev/null; then
            echo "::error::private key material found in the publish root"; exit 1
          fi
          echo "publish root is clean"

      # This runs against the just-built local tree, not the live Pages
      # site — Pages takes time to propagate, and a release must not depend
      # on that latency. It proves the signature is trusted, the index
      # resolves, and the dependency is pulled — the three things that
      # break silently.
      - name: Verify apt can install from the built repo
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/site":/repo debian:12 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq ca-certificates gnupg
            cp /repo/rupu-archive-keyring.asc /etc/apt/trusted.gpg.d/rupu.asc
            echo "deb [signed-by=/etc/apt/trusted.gpg.d/rupu.asc] file:///repo/apt '"$CHANNEL"' main" \
              > /etc/apt/sources.list.d/rupu.list
            apt-get update -qq
            apt-get install -y -qq rupu
            rupu --version
            command -v rg >/dev/null || { echo "ripgrep dependency not resolved"; exit 1; }
          '

      # `gpgcheck=1` and `repo_gpgcheck=1` are both deliberate: the first
      # proves the packages are signed, the second proves the repository
      # metadata is. Do not relax either to make this step pass — that is
      # the whole point of Phase B.
      - name: Verify dnf can install from the built repo
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/site":/repo fedora:41 bash -c '
            set -euo pipefail
            rpm --import /repo/rupu-archive-keyring.asc
            cat > /etc/yum.repos.d/rupu.repo <<REPO
          [rupu]
          name=rupu
          baseurl=file:///repo/yum/'"$CHANNEL"'
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=file:///repo/rupu-archive-keyring.asc
          REPO
            dnf install -y -q rupu
            rupu --version
            command -v rg >/dev/null || { echo "ripgrep dependency not resolved"; exit 1; }
          '

      # Publish by editing a checkout of the EXISTING gh-pages branch, never
      # by replacing the site wholesale. rupu.sh is served from that branch
      # and already contains index.html, styles.css, docs/, 404.html,
      # favicon.svg and CNAME — `deploy-pages` would delete all of it.
      #
      # The resulting tree is then committed as a single ORPHAN commit and
      # force-pushed, rather than added as a normal commit on top of history.
      # Every superseded package blob (30MB+, compressed binaries that do not
      # delta) would otherwise stay in gh-pages' history forever, growing the
      # branch by ~122MB per channel-release and crossing GitHub Pages'
      # recommended 1GB source size within a handful of releases. gh-pages is
      # a generated publish branch, not a source of truth — its prior history
      # is archived permanently at tag `gh-pages-archive-2026-07-29` — so
      # force-pushing a single fresh commit here is deliberate and safe: it
      # is the only thing that keeps this branch from growing unboundedly.
      - name: Publish into gh-pages
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ghp
          # Replace only this channel's trees; everything else on the branch
          # is the website (or the other channel's repo trees) and must
          # survive untouched.
          rm -rf "ghp/apt/dists/$CHANNEL" "ghp/apt/pool/$CHANNEL" "ghp/yum/$CHANNEL"
          mkdir -p ghp/apt ghp/yum
          cp -r site/apt/. ghp/apt/
          cp -r site/yum/. ghp/yum/
          cp site/rupu-archive-keyring.asc ghp/
          # The full site must still be there afterwards. If any of these is
          # missing we are about to publish a broken rupu.sh.
          for f in index.html CNAME .nojekyll styles.css 404.html favicon.svg; do
            test -e "ghp/$f" || { echo "::error::gh-pages lost $f"; exit 1; }
          done
          test -d ghp/docs || { echo "::error::gh-pages lost docs/"; exit 1; }
          cd ghp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then diff the index. A bare `git diff` compares only
          # tracked paths, so it is blind to a file that is untracked — and on
          # a gh-pages branch that has never carried a repository, EVERY file
          # copied in above is untracked. The bare form therefore reported
          # "already current" and exited 0 on the very first publish, which is
          # exactly what happened for v0.71.0: the job went green having
          # published nothing, and `apt install rupu` 404'd while the release
          # looked complete.
          git add -A -- apt yum rupu-archive-keyring.asc
          if git diff --cached --quiet -- apt yum rupu-archive-keyring.asc; then
            # "Already current" only means anything if a previous publish
            # actually landed. If the branch carries no repository at all,
            # then an unchanged index means we are about to report success
            # for a publish that did nothing — the failure above, which was
            # green and silent. Refuse instead.
            git cat-file -e HEAD:rupu-archive-keyring.asc 2>/dev/null || {
              echo "::error::gh-pages carries no repository, yet nothing is staged to publish. Refusing to report success without publishing."
              exit 1
            }
            echo "repositories already current"; exit 0
          fi
          # Rewrite as a single orphan commit: no parent, so nothing from
          # gh-pages' prior history (including every old package blob) is
          # reachable from the branch tip after this push.
          git checkout --orphan gh-pages-publish
          git add -A
          git commit -m "repo: publish $CHANNEL packages for $VERSION"
          git push --force origin gh-pages-publish:gh-pages

      # Harmless on hosted runners (the VM is destroyed after the job), but a
      # real private-key leak if this workflow ever runs on a self-hosted
      # runner, where $RUNNER_TEMP can persist across jobs. Runs even if an
      # earlier step failed.
      - name: Remove the imported signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

  community:
    name: sync community package definitions
    needs: [meta, publish]
    if: needs.meta.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `contents: read` is enough now that the push to `main` goes over SSH with
    # the MAIN_PUSH_KEY deploy key: the ambient token is only used to
    # `gh release download` the checksum sidecars. It could not push to a
    # ruleset-protected `main` anyway — it is not the bypass actor.
    permissions:
      contents: read
    # This job commits to `main`. Two releases running concurrently (or a
    # re-run of an older tag) would both check out main, both regenerate, and
    # the second push would be rejected non-fast-forward — the same race the
    # `repo` job serializes for gh-pages. Not cancel-in-progress: a cancel
    # between commit and push leaves nothing published, and the next release
    # would have to re-do it.
    concurrency:
      group: community-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # The sidecars, and only the sidecars. The `asset-*` artifacts each
      # carry their ~50MB binary alongside the 100-byte `.sha256`, and
      # download-artifact cannot filter within an artifact — pulling them
      # would move ~150MB to read 300 bytes. `publish` (a `needs` of this
      # job) has already uploaded these exact files to the release, so
      # fetching them from there is both narrower and closer to what the
      # generated definitions actually point users at.
      - name: Fetch the checksum sidecars from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p shas
          gh release download "$TAG" --pattern '*.sha256' --dir shas
          ls -la shas

      - name: Regenerate definitions from the templates
        run: ./packaging/sync-community.sh "${{ needs.meta.outputs.version }}" shas

      - name: Prove the regeneration is repeatable
        run: ./packaging/test-sync-community.sh

      # Pushed over SSH with a repository deploy key rather than with the
      # ambient GITHUB_TOKEN, because `main` is protected by a ruleset that
      # requires a pull request — and this job is a direct push.
      #
      # A ruleset needs a bypass actor for that push, and GitHub rejects the
      # first-party GitHub Actions integration as one ("Actor GitHub Actions
      # integration must be part of the ruleset source or owner organization",
      # HTTP 422): repository rulesets can only bypass on actors the repo
      # itself owns. `DeployKey` is such an actor, so the credential has to be
      # a deploy key for the bypass to be expressible at all.
      #
      # That constraint lands somewhere better than a PAT would have. This key
      # can push to this one repository and do nothing else — it cannot read
      # secrets, change settings, or reach any other repo — and it is the only
      # deploy key on `rupu`, so the `DeployKey` bypass grants exactly this
      # one job and nothing more.
      - name: Commit if changed
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          MAIN_PUSH_KEY: ${{ secrets.MAIN_PUSH_KEY }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${MAIN_PUSH_KEY:-}" ]; then
            echo "::error::MAIN_PUSH_KEY is not set. The community definitions cannot be pushed to protected main without it, and a stale flake.nix on main means 'nix run github:Section9Labs/rupu' installs the wrong version — that is a release failure, not a warning."
            exit 1
          fi
          mkdir -p -m 700 "$HOME/.ssh"
          printf '%s\n' "$MAIN_PUSH_KEY" > "$HOME/.ssh/main_push"
          chmod 600 "$HOME/.ssh/main_push"
          ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts_main" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/main_push -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_main"
          # checkout@v5 wired `origin` to an HTTPS URL with the ambient token
          # baked into an extraheader; that identity is not the bypass actor,
          # so the remote must be re-pointed at SSH and the header dropped.
          git config --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "git@github.com:${REPO}.git"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then diff the index: `git diff` alone is blind to a
          # file that is untracked (a future path rename would silently
          # publish nothing).
          git add flake.nix packaging/aur/PKGBUILD packaging/homebrew/rupu.rb
          if git diff --cached --quiet; then
            echo "definitions already current"; exit 0
          fi
          git commit -m "chore(packaging): sync community definitions to $VERSION"
          # Anything landing on main between the checkout and here makes the
          # push non-fast-forward. Rebase onto it and retry once rather than
          # failing the release over a merge that has nothing to do with
          # these three files.
          for attempt in 1 2; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            if [ "$attempt" -eq 2 ]; then break; fi
            echo "::warning::push to main rejected; rebasing onto origin/main and retrying once"
            git fetch origin main
            git rebase origin/main \
              || { echo "::error::rebase onto origin/main failed"; exit 1; }
          done
          echo "::error::could not push the synced definitions to main"
          exit 1

      # Same reasoning as the AUR and tap keys: harmless on a hosted runner
      # whose VM is destroyed, a leak on a self-hosted one.
      - name: Remove the main push key
        if: always()
        run: rm -f "$HOME/.ssh/main_push"

  publish-aur:
    name: publish to the AUR
    needs: [meta, community]
    if: needs.meta.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # `main` at this point already carries the synced PKGBUILD from the
      # `community` job (or already carried it, if this version's sync was a
      # no-op) — checking it out here, rather than re-running the sync,
      # keeps there being exactly one place that computes version + hashes.
      - uses: actions/checkout@v5
        with:
          ref: main

      # AUR requires .SRCINFO to be regenerated for every version bump, and
      # it can only be produced by `makepkg`, which does not exist outside
      # Arch. This never hand-writes it — a hand-written .SRCINFO drifting
      # from PKGBUILD is exactly the class of bug the AUR's own tooling
      # exists to prevent.
      - name: Regenerate .SRCINFO (makepkg is Arch-only, so run it in an Arch container)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/w -w /w archlinux:latest bash -c '
            set -euo pipefail
            # makepkg ships in the `pacman` package, which is in the base
            # image — nothing to install for --printsrcinfo. Installing
            # base-devel with a bare `-Sy` would be a partial upgrade, which
            # errors whenever the mirror db is ahead of the image. Only fall
            # back to an install (a FULL -Syu) if the image ever drops it.
            if ! command -v makepkg >/dev/null 2>&1; then
              pacman -Syu --noconfirm --needed base-devel
            fi
            # makepkg refuses to run as root (even for --printsrcinfo), so
            # do the actual generation as an unprivileged user.
            useradd -m builder
            chown -R builder:builder /w/packaging/aur
            su builder -c "cd /w/packaging/aur && makepkg --printsrcinfo > .SRCINFO"
          '
          test -s packaging/aur/.SRCINFO || { echo "::error::.SRCINFO was not generated"; exit 1; }
          cat packaging/aur/.SRCINFO

      - name: Push to aur.archlinux.org
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          git clone ssh://aur@aur.archlinux.org/rupu-bin.git aur-rupu-bin
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-rupu-bin/
          cd aur-rupu-bin
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          # Stage FIRST, then diff the index. A bare `git diff` sees nothing
          # when the files are untracked — which is exactly the state of a
          # freshly reserved, empty `rupu-bin.git` — so the very first
          # publish would report "already current" and push nothing.
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already current"; exit 0
          fi
          git commit -m "Update to ${{ needs.meta.outputs.version }}"
          # Explicit refspec. `rupu-bin.git` is an empty repo on its first
          # push, so the local branch name comes from whatever the remote
          # advertises as its unborn HEAD — or, if AUR's git advertises
          # nothing, from the runner's `init.defaultBranch`. The AUR rejects
          # a push to any branch but `master`, so name it rather than infer it.
          git push origin HEAD:master

      # The AUR deploy key is a real credential. Harmless on a hosted runner
      # (the VM is destroyed), a leak on a self-hosted one. Same `if: always()`
      # pattern the GPG import above uses.
      - name: Remove the AUR deploy key
        if: always()
        run: rm -f "$HOME/.ssh/aur"

  publish-homebrew:
    name: publish to the Homebrew tap
    needs: [meta, community]
    if: needs.meta.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # `homebrew-tap` being a public repository makes it world-READABLE; it
      # says nothing about who may write. The ambient GITHUB_TOKEN is minted
      # per-run and scoped to THIS repository, so it cannot push to another
      # one regardless of that repo's visibility — a cross-repo push always
      # needs its own credential.
      #
      # That credential is a per-repo deploy key, not a PAT: it can write to
      # `homebrew-tap` and nothing else, it does not expire, and revoking it
      # touches no other repository or account. A PAT would carry the whole
      # of the issuing user's access into this job. Same shape as the AUR
      # push above.
      #
      # Its absence must not fail the release — a formula one version behind
      # is a nuisance a maintainer fixes later; a red release blocks every
      # other asset.
      - name: Publish Formula/rupu.rb to Section9Labs/homebrew-tap
        env:
          TAP_SSH_PRIVATE_KEY: ${{ secrets.TAP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_SSH_PRIVATE_KEY:-}" ]; then
            # ::warning:: so this surfaces as an annotation on the run rather
            # than as one green line in a 2000-line log.
            echo "::warning::TAP_SSH_PRIVATE_KEY is not set — skipping the Homebrew tap publish. The formula will lag one release; this is deliberately not a release failure."
            exit 0
          fi
          mkdir -p -m 700 "$HOME/.ssh"
          printf '%s\n' "$TAP_SSH_PRIVATE_KEY" > "$HOME/.ssh/tap"
          chmod 600 "$HOME/.ssh/tap"
          ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts_tap" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_tap"

          git clone git@github.com:Section9Labs/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp packaging/homebrew/rupu.rb tap/Formula/rupu.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then diff the index. A tap that does not yet have a
          # `Formula/rupu.rb` leaves the copy untracked, and a bare
          # `git diff` reports it clean — the first publish to a fresh tap
          # would say "already current" and push nothing.
          git add Formula/rupu.rb
          if git diff --cached --quiet; then
            echo "tap formula already current"; exit 0
          fi
          git commit -m "rupu ${{ needs.meta.outputs.version }}"
          # Explicit refspec, aimed at the tap's configured default branch.
          # `brew` clones the default branch, so pushing to any other name
          # publishes a formula nobody can install. The tap is public, so the
          # ambient GITHUB_TOKEN can READ its metadata even though it cannot
          # write to it; fall back to `main` if the query fails.
          DEFAULT_BRANCH="$(GH_TOKEN="${{ github.token }}" gh api repos/Section9Labs/homebrew-tap --jq .default_branch 2>/dev/null || true)"
          git push origin "HEAD:${DEFAULT_BRANCH:-main}"

      # Same reasoning as the AUR key: harmless on a hosted runner whose VM is
      # destroyed, a leak on a self-hosted one.
      - name: Remove the tap deploy key
        if: always()
        run: rm -f "$HOME/.ssh/tap"
