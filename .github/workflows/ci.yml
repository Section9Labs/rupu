name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release-beta.yml refuses to cut a tag unless ci.yml is green for main's
  # EXACT HEAD SHA, and that check is deliberately not force-bypassable. So a
  # single dropped `push` event — GitHub does occasionally fail to create a
  # run, with Actions itself reporting operational — strands the release: the
  # commit has no run, the gate sees none, and every later beta skips.
  #
  # Without this trigger the only recovery is pushing a junk commit to main
  # purely to re-fire the event, which is a bad thing to need at exactly the
  # moment the release path is stuck. A dispatched run on main carries main's
  # HEAD as its headSha, so it satisfies the gate's query the same way a push
  # run does.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three community package definitions (Nix flake, AUR PKGBUILD,
  # Homebrew formula) are generated at release time and pushed straight to the
  # AUR and the tap — without this, a typo in one of them is discovered by an
  # end user AFTER the push already happened.
  #
  # Deliberately cheap: renders the templates into a scratch dir with
  # fabricated hashes and syntax-checks the result. No nix, no docker, no
  # brew. It runs unconditionally rather than behind a `paths` filter — at a
  # few seconds, gating it would cost more than it saves — and NOTHING in
  # the release workflow depends on it.
  community-packaging:
    name: community package definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The defect this guards: the sync used to substitute placeholders in
      # the committed files, so it worked exactly once and every later
      # release silently shipped the first release's version and hashes.
      - name: Idempotence regression test
        run: ./packaging/test-sync-community.sh

      - name: Render the definitions with fabricated hashes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shas" "$RUNNER_TEMP/render"
          hex() { printf "$1%.0s" $(seq 64); }
          printf '%s  rupu-linux-x64\n'    "$(hex 1)" > "$RUNNER_TEMP/shas/rupu-linux-x64.sha256"
          printf '%s  rupu-linux-arm64\n'  "$(hex 2)" > "$RUNNER_TEMP/shas/rupu-linux-arm64.sha256"
          printf '%s  rupu-darwin-arm64\n' "$(hex 3)" > "$RUNNER_TEMP/shas/rupu-darwin-arm64.sha256"
          ./packaging/sync-community.sh 9.9.9 "$RUNNER_TEMP/shas" "$RUNNER_TEMP/render"

      - name: Syntax-check the rendered PKGBUILD and formula
        run: |
          set -euo pipefail
          bash -n "$RUNNER_TEMP/render/packaging/aur/PKGBUILD"
          ruby -c "$RUNNER_TEMP/render/packaging/homebrew/rupu.rb"
          # nix isn't installed here (and installing it for a syntax check is
          # not "cheap"), so assert the flake's shape instead: balanced braces
          # and the three system attributes the release job substitutes into.
          for attr in '"x86_64-linux"' '"aarch64-linux"' '"aarch64-darwin"'; do
            grep -q -- "$attr" "$RUNNER_TEMP/render/flake.nix" \
              || { echo "::error::flake.nix lost the $attr attribute"; exit 1; }
          done

      # The committed copies are generated output. If they ever drift from
      # what the templates produce, the next release silently reverts the
      # drift — better to catch the hand-edit here.
      - name: The committed definitions must match the templates
        run: |
          set -euo pipefail
          for pair in \
            "packaging/templates/flake.nix.in:flake.nix" \
            "packaging/templates/PKGBUILD.in:packaging/aur/PKGBUILD" \
            "packaging/templates/rupu.rb.in:packaging/homebrew/rupu.rb"; do
            tpl="${pair%%:*}"; out="${pair##*:}"
            # Compare the template against the committed file with the
            # placeholders still in place: between releases they are the same
            # bytes, and any difference is a hand-edit of the generated file.
            if ! diff -u "$tpl" "$out" > /tmp/drift.diff; then
              # After a release the committed file carries real values, so a
              # diff is only a failure while placeholders are still present.
              if grep -q "REPLACED_BY_CI" "$out"; then
                # Which side moved is not knowable from here, and both need
                # the same remedy: the template is the source of truth, so
                # copy it over the generated file and commit both.
                echo "::error::$tpl and $out disagree while placeholders are still in place. $tpl is the source of truth — run 'cp $tpl $out' and commit both. (Editing $out directly has no effect: it is regenerated on every release.)"
                cat /tmp/drift.diff
                exit 1
              fi
              echo "$out carries released values (expected after a stable release)"
            fi
          done

  # ── Linux musl gate ───────────────────────────────────────────────────
  #
  # Previously one sequential job that took 37-51 minutes (measured over four
  # runs: 2229s / 2369s / 3029s / 3046s). Two things made it slow:
  #
  #   1. No caching of any kind. Every run recompiled the whole dependency
  #      graph for musl from cold, including the expensive C builds
  #      (aws-lc-rs, git2's vendored libgit2 + OpenSSL).
  #   2. Build / Test / Clippy ran back to back and shared nothing. `Build`
  #      is `--release` into `target/linux-musl`; `Test` and `Clippy` are
  #      debug into `target/`. Different profile AND different target dir, so
  #      the 800-1137s release build contributed nothing to the 957-1278s
  #      test build.
  #
  # Now they are three parallel jobs, each with its own warm cache. Wall
  # clock is the slowest one rather than the sum.
  #
  # Second pass (Sept 2026), measured on a warm cache:
  #
  #   3. `test` spent 16m20s compiling and ~70s running. The compile was
  #      dominated by LINKING ~190 test binaries (every tests/*.rs file is
  #      its own static binary) with full debuginfo through GNU ld. It now
  #      links with mold, builds without debuginfo, and actually receives
  #      CARGO_INCREMENTAL=0 — rust-cache exports that on the runner, but
  #      it never reached the container.
  #   4. release.yml had no cache at all and rebuilt every dependency cold
  #      on every tag. `build` now doubles as the release cache warmer: it
  #      runs the release's exact command in the release's exact target
  #      dir, for both Linux architectures, under a key release.yml
  #      restores. See the note on its rust-cache step.
  #
  # Building the docker image is NOT the problem — measured at 20-25s, under
  # 1% of the job. It stays inline so the Dockerfile remains the single
  # source of truth. Publishing it to ghcr would buy ~20s and is not worth
  # the moving parts.
  #
  # The required status check is named `linux musl (build + test)`
  # (.github/rulesets/main.json). That name is preserved by the aggregator
  # job at the bottom — renaming or removing it would silently un-gate main.

  linux-musl-build:
    name: linux musl · build (${{ matrix.platform }})
    # Both architectures release.yml ships. arm64 used to be built for the
    # first time at release, so an arch-specific break surfaced only there —
    # and release.yml had no warm arm64 cache to restore.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # NO job- or workflow-level CARGO*/RUST*/CC*/CFLAGS*/CXX*/CMAKE* env
    # here: rust-cache hashes those into the key, and release.yml's linux job
    # must compute the identical key to restore this cache.
    steps:
      - uses: actions/checkout@v5

      - name: Build the pinned musl image
        run: docker build -f docker/linux-build.Dockerfile -t rupu-linux-build .

      # `cache-directories` picks up the in-workspace CARGO_HOME mounted into
      # the container below. The container's own CARGO_HOME is baked into the
      # image and thrown away with it, so without this mount the registry and
      # git checkouts are re-fetched on every run no matter what else is
      # cached.
      #
      # `save-if` restricts writes to main. GitHub scopes caches so that a
      # cache written on the default branch is readable from every branch —
      # and from every tag — but not vice versa. So PRs restore main's cache
      # and never thrash it, and release.yml's tag runs restore it too.
      #
      # This block is the RELEASE CACHE WARMER. release.yml's `linux` job has
      # the same rust-cache inputs (prefix-key, shared-key, workspaces,
      # cache-directories) and runs the same build command into the same
      # target dir. `shared-key` rather than `key` is what makes that work:
      # `key` is combined with the job id, which differs between the two
      # workflows; `shared-key` replaces it. The runner OS + arch are
      # appended automatically, so x64 and arm64 never collide. Change one
      # side and the release silently goes back to building cold.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: musl-release
          shared-key: ${{ hashFiles('docker/linux-build.Dockerfile', 'rust-toolchain.toml') }}
          # This job builds into target/linux-musl, not target/. Pointing the
          # action at the wrong directory would let its pruning pass discard
          # precisely the artifacts we are trying to keep.
          workspaces: ". -> target/linux-musl"
          cache-directories: ".cargo-musl"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the static CLI
        run: |
          mkdir -p .cargo-musl
          docker run --rm -v "$PWD":/work -w /work \
            -v "$PWD/.cargo-musl":/cargo -e CARGO_HOME=/cargo \
            rupu-linux-build \
            cargo build --release -p rupu-cli --target-dir target/linux-musl

      - name: Verify the binary is genuinely static and self-describing
        run: |
          docker run --rm -v "$PWD":/work -w /work rupu-linux-build sh -c '
            set -e
            bin=target/linux-musl/release/rupu
            desc=$(file "$bin")
            echo "$desc"
            # Assert, do not merely print: a dynamically-linked binary here
            # would defeat the whole reason for choosing musl.
            #
            # Test for the absence of a dynamic link rather than for one
            # spelling of "static". musl emits "static-pie linked" (a static
            # position-independent executable), not "statically linked", so
            # matching the latter rejects a perfectly good binary.
            case "$desc" in
              *"dynamically linked"*)
                echo "::error::binary is dynamically linked: $desc"; exit 1 ;;
            esac
            echo "$desc" | grep -qE "static-pie linked|statically linked" \
              || { echo "::error::could not confirm static linking: $desc"; exit 1; }
            ldd "$bin" 2>&1 | head -3 || true
            ./"$bin" --version
            ./"$bin" update --print-platform
          '

      # Static linking is the whole point of choosing musl: a glibc build
      # made on this runner would not run on Debian 12 (glibc 2.36). Debian
      # has no musl at all, so a successful run here proves it.
      - name: Verify it runs on a distro it was not built on
        run: |
          docker run --rm -v "$PWD":/work -w /work debian:12 \
            /work/target/linux-musl/release/rupu --version
          docker run --rm -v "$PWD":/work -w /work alpine:3.21 \
            /work/target/linux-musl/release/rupu update --print-platform

      # The container runs as root, so everything it wrote under target/ and
      # .cargo-musl is root-owned. The cache action runs as the runner user
      # and cannot read those, so its post-step would silently save nothing.
      - name: Hand the artifacts back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target .cargo-musl 2>/dev/null || true

  linux-musl-test:
    name: linux musl · test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Set here rather than only on `docker run` so rust-cache hashes them
    # into its key: each one changes every compiled artifact, and restoring
    # a cache built without them would be restoring garbage. Passed through
    # to the container by name (`-e NAME`) in the Test step.
    #
    #   RUSTFLAGS               link with mold (installed in the image). CI
    #                           test binaries only — release binaries keep
    #                           the default linker.
    #   CARGO_PROFILE_DEV_DEBUG no debuginfo in test binaries. Nothing reads
    #                           it in CI (RUST_BACKTRACE is unset), and it is
    #                           most of what the linker has to chew through.
    #   CARGO_INCREMENTAL       rust-cache exports 0 on the runner, but the
    #                           container never saw it — so every run wrote
    #                           incremental state that was then thrown away.
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      # Every test binary that links rupu-findings-report carries Typst and
      # its bundled fonts, and with full debug info the target dir outgrows
      # the runner's free disk. Reclaim the preinstalled SDKs this job never
      # uses (the build runs in the musl container).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the pinned musl image
        run: docker build -f docker/linux-build.Dockerfile -t rupu-linux-build .

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: musl-test
          key: ${{ hashFiles('docker/linux-build.Dockerfile', 'rust-toolchain.toml') }}
          workspaces: ". -> target"
          cache-directories: ".cargo-musl"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Line tables only: panics and backtraces still name file:line, but
      # the dozens of test binaries stop carrying full debug info.
      - name: Test
        run: |
          mkdir -p .cargo-musl
          docker run --rm -v "$PWD":/work -w /work \
            -v "$PWD/.cargo-musl":/cargo -e CARGO_HOME=/cargo \
            -e RUSTFLAGS -e CARGO_PROFILE_DEV_DEBUG -e CARGO_INCREMENTAL \
            rupu-linux-build \
            cargo test --workspace --locked

      - name: Hand the artifacts back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target .cargo-musl 2>/dev/null || true

  linux-musl-lint:
    name: linux musl · lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same reason as the test job: rust-cache exports this on the runner
    # only. Set at job level so it keys the cache; passed by name below.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      # docs/pages/rupu-archive-keyring.asc is served at a stable URL that
      # users pin trust to (https://rupu.sh/rupu-archive-keyring.asc).
      # This guards against a private key ever being committed there by
      # accident. Costs milliseconds, so it rides along here rather than
      # occupying a job of its own.
      - name: Assert the published keyring is public-only
        run: |
          set -euo pipefail
          f=docs/pages/rupu-archive-keyring.asc
          grep -q "BEGIN PGP PUBLIC KEY BLOCK" "$f" || { echo "::error::$f is not a public key block"; exit 1; }
          if grep -q "PRIVATE KEY BLOCK" "$f"; then
            echo "::error::$f contains private key material"; exit 1
          fi

      - name: Build the pinned musl image
        run: docker build -f docker/linux-build.Dockerfile -t rupu-linux-build .

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: musl-lint
          key: ${{ hashFiles('docker/linux-build.Dockerfile', 'rust-toolchain.toml') }}
          workspaces: ". -> target"
          cache-directories: ".cargo-musl"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Guards the property that makes static linking possible. `keyring`
      # was removed from the workspace (#554) precisely so the Linux graph
      # has no D-Bus dependency; a future crate re-adding it would break the
      # release build at the worst possible moment, silently.
      - name: Assert keyring and dbus stay out of the Linux graph
        run: |
          mkdir -p .cargo-musl
          leaked=$(docker run --rm -v "$PWD":/work -w /work \
            -v "$PWD/.cargo-musl":/cargo -e CARGO_HOME=/cargo \
            rupu-linux-build \
            cargo tree --workspace -e normal --prefix none \
            | grep -E '^(keyring|libdbus-sys|dbus-secret-service) ' | sort -u || true)
          if [ -n "$leaked" ]; then
            echo "::error::keyring/dbus leaked back into the Linux dependency graph:"
            echo "$leaked"
            exit 1
          fi
          echo "Linux graph is clean."

      - name: Clippy
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -v "$PWD/.cargo-musl":/cargo -e CARGO_HOME=/cargo \
            -e CARGO_INCREMENTAL \
            rupu-linux-build \
            cargo clippy --workspace --all-targets --locked -- -D warnings

      # PDF export is a default-on `pdf` feature; everything above builds with
      # it. This keeps the build without it (no Typst, no bundled fonts)
      # compiling too.
      - name: Check the CLI without PDF support
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -v "$PWD/.cargo-musl":/cargo -e CARGO_HOME=/cargo \
            rupu-linux-build \
            cargo check -p rupu-cli --no-default-features --locked

      # Informational only: `main` carries a large number of rustfmt diff
      # sites predating this workflow. Promote to blocking once a dedicated
      # formatting-cleanup PR has landed.
      - name: Format (informational)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/work -w /work rupu-linux-build \
            cargo fmt --all --check

      - name: Hand the artifacts back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target .cargo-musl 2>/dev/null || true

  # Aggregator. Exists solely to preserve the required status check name
  # `linux musl (build + test)` from .github/rulesets/main.json while the
  # actual work runs in the three parallel jobs above. Renaming this job
  # un-gates main without any other visible symptom.
  #
  # `if: always()` plus the explicit result check is deliberate: without it a
  # skipped or cancelled dependency reports success and the gate passes on a
  # build that never ran.
  linux-musl:
    name: linux musl (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [linux-musl-build, linux-musl-test, linux-musl-lint]
    if: always()
    steps:
      - name: Require every musl job to have succeeded
        run: |
          set -euo pipefail
          build='${{ needs.linux-musl-build.result }}'
          test='${{ needs.linux-musl-test.result }}'
          lint='${{ needs.linux-musl-lint.result }}'
          echo "build=$build test=$test lint=$lint"
          for r in "$build" "$test" "$lint"; do
            if [ "$r" != "success" ]; then
              echo "::error::a linux musl job did not succeed"
              exit 1
            fi
          done
          echo "All linux musl jobs succeeded."

  # ── darwin release-cache warmer ───────────────────────────────────────
  #
  # release.yml's darwin-arm64 build had no cache and compiled every
  # dependency cold on every tag (~14 min). A tag run can restore a cache
  # written on main, so this job writes one: the release's exact toolchain
  # setup and build command, under the same rust-cache inputs as release.yml's
  # `macos` job. Keep the two in lockstep — the steps before rust-cache too,
  # since rust-cache hashes every installed toolchain and any CARGO*/RUST*
  # env var into its key.
  #
  # Not run on pull requests: it would add a macOS runner (the scarce pool)
  # to every PR to warm a cache PRs never write. On main it doubles as the
  # first macOS compile of the Rust workspace, ahead of any release — and
  # like every job here, a failure blocks release-beta.yml's green-CI gate.
  darwin-release-build:
    name: darwin-arm64 · release build
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: darwin-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the CLI (release)
        run: cargo build --release -p rupu-cli

  release-scripts:
    name: release cadence scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # These scripts decide what gets published unattended every morning. A
      # counter regression here silently republishes an old version, so they
      # are gated on every PR rather than trusted.
      - run: scripts/tests/release-cadence-tests.sh
