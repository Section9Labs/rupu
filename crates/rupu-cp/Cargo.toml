[package]
name = "rupu-cp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# PDF finding-report export (embeds Typst and its fonts, roughly +50 MB in a
# release binary). Without it the other export formats still work and a PDF
# request answers 501.
default = ["pdf"]
pdf = ["rupu-findings-report/pdf"]

[dependencies]
axum = { workspace = true, features = ["ws"] }
chrono.workspace = true
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
subtle.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
bytes.workspace = true
futures-util = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
object_store = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
reqwest-middleware.workspace = true
rupu-netflow = { workspace = true, features = ["http"] }
ulid.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
toml.workspace = true
toml_edit = { workspace = true }
fs2 = { workspace = true }
rustix.workspace = true

# In-workspace
rupu-orchestrator = { path = "../rupu-orchestrator" }
rupu-config = { path = "../rupu-config" }
rupu-agent = { path = "../rupu-agent" }
rupu-workspace = { path = "../rupu-workspace" }
rupu-runtime = { path = "../rupu-runtime" }
rupu-coverage = { path = "../rupu-coverage" }
rupu-transcript = { path = "../rupu-transcript" }
rupu-ast = { path = "../rupu-ast" }
rupu-scm = { path = "../rupu-scm" }
rupu-mcp = { path = "../rupu-mcp" }
rupu-findings-report = { path = "../rupu-findings-report", default-features = false }
rupu-codename = { workspace = true }

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
serial_test.workspace = true
git2.workspace = true
rupu-config = { path = "../rupu-config" }
rupu-transcript = { path = "../rupu-transcript" }
httpmock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "test-util"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json.workspace = true
tower.workspace = true
http-body-util.workspace = true
http.workspace = true
tar.workspace = true
