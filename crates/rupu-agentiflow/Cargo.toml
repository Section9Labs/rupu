[package]
name = "rupu-agentiflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rupu-coverage = { workspace = true }
rupu-fleet = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# CancellationToken: the lead's per-round pause token (`send --now`).
tokio-util = { workspace = true }
ulid = { workspace = true }
# kill(2) wrappers for unit liveness/termination (src/proc.rs). The workspace
# entry already enables `process`; stated here so the need is local.
rustix = { workspace = true, features = ["process"] }

# In-workspace crates the run_agent-backed lead driver sits on. These are
# path deps (not [workspace.dependencies] entries), matching how rupu-runtime,
# rupu-agent and the rest reference each other. rupu-agent depends on neither
# rupu-fleet nor rupu-agentiflow, so this edge is acyclic.
rupu-agent = { path = "../rupu-agent" }
rupu-providers = { path = "../rupu-providers" }
rupu-tools = { path = "../rupu-tools" }
# RunTriggerSource (the persisted record's `trigger`). rupu-runtime does not
# depend on rupu-agentiflow, so this edge is acyclic too.
rupu-runtime = { path = "../rupu-runtime" }
# The unit's transcript reader (started-evidence + final answer) for the
# subprocess launcher. A leaf crate, so this edge is acyclic.
rupu-transcript = { path = "../rupu-transcript" }
# The library workflow lister (`list_workflow_summaries`) behind the roster
# read tools. rupu-orchestrator does not depend on rupu-agentiflow, so this
# edge is acyclic. (Not a [workspace.dependencies] entry; a path dep like the
# other in-workspace crates above.)
rupu-orchestrator = { path = "../rupu-orchestrator" }
# USD pricing (`pricing::lookup`, `ModelPricing::cost_usd`) behind the
# ledger-backed `budget.usd` meter. rupu-config is foundational (it depends on
# no other in-workspace crate), so this edge is acyclic.
rupu-config = { path = "../rupu-config" }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
