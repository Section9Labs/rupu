[package]
name = "rupu-scm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true
chrono.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
rupu-netflow = { workspace = true, features = ["http"] }
url.workspace = true
octocrab.workspace = true
http.workspace = true
git2.workspace = true
lru.workspace = true
rand.workspace = true
dirs.workspace = true
base64.workspace = true

# In-workspace
rupu-auth = { path = "../rupu-auth" }
rupu-config = { path = "../rupu-config" }
rupu-providers = { path = "../rupu-providers" }

[features]
default = []
test-helpers = []

[dev-dependencies]
tempfile.workspace = true
httpmock.workspace = true
serde_json.workspace = true
# Self-dependency so `tests/*.rs` integration tests (compiled against a
# separate, non-`cfg(test)` build of this crate) can reach the
# `#[cfg(any(test, feature = "test-helpers"))]`-gated `insert_*_connector`
# test seams. See ISSUES.md I-77.
rupu-scm = { path = ".", features = ["test-helpers"] }
